<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChordPeek — song room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#060608; --ink:#F5F4F2; --ink60:rgba(245,244,242,.6); --ink40:rgba(245,244,242,.4);
    --line:rgba(245,244,242,.12); --card:rgba(18,18,22,.78); --accent:#E8C87A;
    --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font-body);overflow:hidden}
  #theaterRoot{position:fixed;inset:0}
  #theaterRoot > div{position:absolute;inset:0}

  .rm-hud{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;flex-direction:column}
  .rm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 0}
  .rm-back{
    pointer-events:auto;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;
    background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);
    padding:10px 16px 10px 12px;border-radius:99px;font-size:13px;font-weight:600;font-family:var(--font-body);
    transition:border-color .15s,transform .15s;
  }
  .rm-back:hover{border-color:var(--accent);transform:translateX(-2px)}
  .rm-back svg{width:15px;height:15px}

  .rm-mood{
    pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--card);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:12px;font-weight:500;color:var(--ink60);
  }
  .rm-mood .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

  /* marquee — fades in once the camera has settled into the seat */
  .rm-marquee{
    position:fixed;left:50%;top:26px;transform:translate(-50%,-10px);z-index:12;pointer-events:none;
    display:flex;align-items:center;gap:9px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:99px;padding:9px 18px 9px 14px;opacity:0;transition:opacity .6s ease,transform .6s var(--ease);
  }
  .rm-marquee.show{opacity:1;transform:translate(-50%,0)}
  .rm-marquee-live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;animation:rmpulse 1.6s ease-in-out infinite}
  @keyframes rmpulse{0%,100%{opacity:1}50%{opacity:.35}}
  .rm-marquee-text{font-size:12.5px;font-weight:600;color:var(--ink)}
  .rm-marquee-text b{font-weight:700}
  .rm-marquee-text span{color:var(--ink60);font-weight:500}

  .rm-hint{
    pointer-events:auto;font-size:11.5px;color:var(--ink40);background:var(--card);backdrop-filter:blur(14px);font-weight:500;
    border:1px solid var(--line);padding:9px 15px;border-radius:99px;display:flex;align-items:center;gap:8px;
    opacity:0;transition:opacity .6s ease;
  }
  .rm-hint.show{opacity:1}
  .rm-hint svg{width:13px;height:13px;flex-shrink:0}

  /* story tab — a slide-up sheet, collapsed by default so the screen stays the hero */
  .rm-storytab{
    pointer-events:auto;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:13;
    display:flex;align-items:center;gap:8px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:99px;padding:11px 20px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
    opacity:0;transition:opacity .6s ease,border-color .15s;
  }
  .rm-storytab.show{opacity:1}
  .rm-storytab:hover{border-color:var(--accent)}
  .rm-storytab svg{width:13px;height:13px;transition:transform .25s var(--ease)}
  .rm-storytab.open svg{transform:rotate(180deg)}

  .rm-sheet{
    pointer-events:auto;position:fixed;left:0;right:0;bottom:0;z-index:14;background:#0C0C0F;border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .4s var(--ease);
    max-height:62vh;overflow-y:auto;box-shadow:0 -30px 60px -20px rgba(0,0,0,.6);
  }
  .rm-sheet.open{transform:translateY(0)}
  .rm-sheet-body{max-width:640px;margin:0 auto;padding:30px 26px 38px;position:relative}
  .rm-sheet-close{position:absolute;top:16px;right:20px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(245,244,242,.08);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .rm-song-title{font-family:var(--font-display);font-weight:600;font-size:23px;line-height:1.16;margin:0 0 4px}
  .rm-song-artist{font-size:14px;color:var(--ink60);font-weight:500}
  .rm-meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--ink40);font-weight:500}
  .rm-divider{height:1px;background:var(--line);margin:22px 0}
  .rm-story-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink40);font-weight:600;margin-bottom:10px}
  .rm-story-text{font-size:14.5px;line-height:1.7;color:rgba(245,244,242,.82);max-width:62ch}

  .rm-loading{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#060608;z-index:40;color:var(--ink);gap:16px;transition:opacity .5s ease;
  }
  .rm-loading.hide{opacity:0;pointer-events:none}
  .rm-spin{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(245,244,242,.15);border-top-color:var(--accent);animation:rmspin .8s linear infinite}
  @keyframes rmspin{to{transform:rotate(360deg)}}
  .rm-loading span{font-size:12.5px;color:var(--ink40);font-weight:500}

  .rm-err{display:none}
  .rm-err a{color:var(--accent);font-weight:600;text-decoration:none}

  @media (max-width:640px){
    .rm-marquee{max-width:90vw}
    .rm-marquee-text{font-size:11.5px}
    .rm-hint{display:none}
  }
</style>
</head>
<body>

<div class="rm-loading" id="rmLoading"><div class="rm-spin"></div><span>Finding your seat…</span></div>
<div class="rm-err" id="rmErr"></div>

<div id="theaterRoot"></div>

<div class="rm-hud">
  <div class="rm-top">
    <a class="rm-back" id="rmBack" href="lobby.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <span>All rooms</span>
    </a>
    <div class="rm-mood"><span class="dot"></span><span class="label" id="rmMoodLabel"></span></div>
  </div>
</div>

<div class="rm-marquee" id="rmMarquee">
  <span class="rm-marquee-live"></span>
  <span class="rm-marquee-text">NOW PLAYING — <b id="rmMarqueeTitle"></b> <span id="rmMarqueeArtist"></span></span>
</div>

<div class="rm-hint" id="rmHint" style="position:fixed;left:20px;bottom:18px;z-index:13">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  Click the screen for sound/controls
</div>

<div class="rm-storytab" id="rmStoryTab">
  <span id="rmStoryTabLabel">The story</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</div>
<div class="rm-sheet" id="rmSheet">
  <div class="rm-sheet-body" id="rmSheetBody">
    <button class="rm-sheet-close" id="rmSheetClose" type="button" aria-label="Close">✕</button>
  </div>
</div>

<!-- ───────────────────────────────────────────────────────────
     Loading safety-net: ES module imports can silently fail
     (file:// CORS, a missing vendor file), leaving the spinner
     stuck forever with no sign anything went wrong. -->
<script>
(function(){
  var sceneStarted = false;
  window.__cpSceneStarted = function(){ sceneStarted = true; };
  function showLoadError(reason){
    if (sceneStarted) return;
    var loading = document.getElementById('rmLoading');
    if (loading) loading.style.display = 'none';
    var err = document.getElementById('rmErr');
    if (!err) return;
    var isFileProtocol = location.protocol === 'file:';
    err.style.display = 'flex';
    err.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060608;color:#F5F4F2;z-index:50;text-align:center;padding:32px;gap:14px;font-family:ui-sans-serif,system-ui,sans-serif';
    err.innerHTML =
      '<div style="font-size:19px;font-weight:700;max-width:420px">Couldn’t open the theater' + (isFileProtocol ? ' from a local file' : '') + '.</div>' +
      '<div style="font-size:14.5px;color:rgba(245,244,242,.65);max-width:440px;line-height:1.6">' +
      (isFileProtocol
        ? 'This page needs to run from a web server, not be opened by double-clicking the file. From a terminal in this folder, run <code style="background:#17171b;padding:2px 7px;border-radius:6px;border:1px solid rgba(245,244,242,.15)">python3 -m http.server</code> and open <code style="background:#17171b;padding:2px 7px;border-radius:6px;border:1px solid rgba(245,244,242,.15)">localhost:8000</code> &mdash; or just visit the live deployed site, which works out of the box.'
        : 'Something needed for the 3D scene didn’t load (' + (reason || 'unknown error') + '). Check your connection and try again.') +
      '</div>' +
      '<a href="lobby.html" style="color:#E8C87A;font-weight:600;font-size:14px">Back to the gallery</a>';
  }
  var timeoutId = setTimeout(function(){ showLoadError('taking too long'); }, 8000);
  window.addEventListener('error', function(e){
    clearTimeout(timeoutId);
    showLoadError(e.message || (e.filename ? 'failed to load ' + e.filename : null));
  });
  window.__cpClearLoadTimeout = function(){ clearTimeout(timeoutId); };
})();
</script>

<script src="songs-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

/* ───────────────────────────────────────────────────────────
   Find the song
─────────────────────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
const wantTitle = params.get('song') || SONGS[0].title;
const song = SONGS.find(s => s.title.toLowerCase() === wantTitle.toLowerCase()) || SONGS[0];

if (!song) {
  if (window.__cpSceneStarted) window.__cpSceneStarted();
  if (window.__cpClearLoadTimeout) window.__cpClearLoadTimeout();
  document.getElementById('rmLoading').style.display = 'none';
  document.getElementById('rmErr').style.display = 'flex';
  document.getElementById('rmErr').innerHTML = `<div>Couldn't find that song.</div><a href="lobby.html">Back to the gallery</a>`;
  throw new Error('no song');
}
document.title = `${song.title} — ChordPeek theater`;

const hue = song.mood.hue;
const accentCSS = `hsl(${hue} 72% 68%)`;
document.documentElement.style.setProperty('--accent', accentCSS);
document.getElementById('rmMoodLabel').textContent = song.mood.name;
document.getElementById('rmMarqueeTitle').textContent = song.title;
document.getElementById('rmMarqueeArtist').textContent = `— ${song.artist}`;

const accent3D = new THREE.Color().setHSL(hue / 360, 0.65, 0.6);
const washColor = new THREE.Color().setHSL(hue / 360, 0.55, 0.14);
const aisleColor = new THREE.Color().setHSL(hue / 360, 0.6, 0.5);

/* ───────────────────────────────────────────────────────────
   Story sheet content
─────────────────────────────────────────────────────────── */
document.getElementById('rmSheetBody').insertAdjacentHTML('beforeend', `
  <h2 class="rm-song-title">${song.title}</h2>
  <div class="rm-song-artist">${song.artist}</div>
  <div class="rm-meta-row"><span>${song.album}</span><span>${song.year}</span><span>${song.genre}</span></div>
  <div class="rm-divider"></div>
  <div class="rm-story-label">The story</div>
  <div class="rm-story-text">${song.story}</div>
`);
const storyTab = document.getElementById('rmStoryTab');
const sheet = document.getElementById('rmSheet');
function toggleSheet(){
  const open = sheet.classList.toggle('open');
  storyTab.classList.toggle('open', open);
  document.getElementById('rmStoryTabLabel').textContent = open ? 'Close' : 'The story';
}
storyTab.addEventListener('click', toggleSheet);
document.getElementById('rmSheetClose').addEventListener('click', toggleSheet);

/* ───────────────────────────────────────────────────────────
   Dual renderer setup — CSS3DRenderer projects a real, live
   iframe into the 3D scene for the screen; WebGLRenderer draws
   the theater around it on a transparent layer on top. Nothing
   in the WebGL scene overlaps the screen's screen-space area,
   so no depth-sorting between the two layers is needed.
─────────────────────────────────────────────────────────── */
const root = document.getElementById('theaterRoot');

const cssScene = new THREE.Scene();
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(innerWidth, innerHeight);
root.appendChild(cssRenderer.domElement);

const glScene = new THREE.Scene();
const glRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
glRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
glRenderer.setSize(innerWidth, innerHeight);
glRenderer.domElement.style.pointerEvents = 'none';
glRenderer.shadowMap.enabled = true;
glRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
root.appendChild(glRenderer.domElement);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

/* ───────────────────────────────────────────────────────────
   The screen — a real YouTube iframe, CSS3D-projected
─────────────────────────────────────────────────────────── */
/* Screen size is a balance: big enough that it dominates the view with no
   blank space around it, but not so tall that keeping its bottom edge
   above the floor forces the seat to look sharply upward — that upward
   pitch is what keystones a flat screen into a trapezoid. */
const SCREEN_W = 7.6, SCREEN_H = SCREEN_W * 9 / 16;
const SCREEN_Y = 2.5, SCREEN_Z = -9.2;

const iframeEl = document.createElement('iframe');
iframeEl.style.width = '1280px';
iframeEl.style.height = '720px';
iframeEl.style.border = '0';
iframeEl.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
iframeEl.setAttribute('allowfullscreen', '');
iframeEl.src = `https://www.youtube.com/embed/${song.youtubeId}?rel=0&playsinline=1&modestbranding=1&color=white&autoplay=1&mute=0`;

const screenObject = new CSS3DObject(iframeEl);
screenObject.position.set(0, SCREEN_Y, SCREEN_Z);
const cssScale = SCREEN_W / 1280;
screenObject.scale.set(cssScale, cssScale, cssScale);
cssScene.add(screenObject);

/* a matching WebGL plane sits exactly behind the iframe so
   there's a seamless black bezel before the video frame loads */
const screenBack = new THREE.Mesh(
  new THREE.PlaneGeometry(SCREEN_W, SCREEN_H),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
screenBack.position.set(0, SCREEN_Y, SCREEN_Z - 0.01);
glScene.add(screenBack);

/* glowing mood-tinted proscenium frame around the screen */
function frameBar(w, h, x, y){
  const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.12), new THREE.MeshStandardMaterial({
    color: 0x111113, emissive: accent3D, emissiveIntensity: 0.25, roughness: 0.6,
  }));
  bar.position.set(x, y, SCREEN_Z - 0.02);
  glScene.add(bar);
}
const fm = 0.14;
frameBar(SCREEN_W + fm * 2, fm, 0, SCREEN_Y + SCREEN_H / 2 + fm / 2);
frameBar(SCREEN_W + fm * 2, fm, 0, SCREEN_Y - SCREEN_H / 2 - fm / 2);
frameBar(fm, SCREEN_H + fm * 2, -SCREEN_W / 2 - fm / 2, SCREEN_Y);
frameBar(fm, SCREEN_H + fm * 2, SCREEN_W / 2 + fm / 2, SCREEN_Y);

/* screen glow washing onto the room */
const screenGlow = new THREE.PointLight(accent3D, 9, 22, 1.6);
screenGlow.position.set(0, SCREEN_Y, SCREEN_Z + 1.8);
glScene.add(screenGlow);

/* ───────────────────────────────────────────────────────────
   Theater shell — near-black room, raked floor, back wall
─────────────────────────────────────────────────────────── */
glScene.add(new THREE.AmbientLight(0x0a0a0d, 1));

const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x07070a, roughness: 0.9 });
const washMat = new THREE.MeshStandardMaterial({ color: washColor, roughness: 0.9, emissive: washColor, emissiveIntensity: 0.18 });

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(26, 12), wallMat);
backWall.position.set(0, 4, SCREEN_Z - 2);
glScene.add(backWall);

const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), washMat);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(-9, 4, 0);
glScene.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), washMat);
rightWall.rotation.y = -Math.PI / 2;
rightWall.position.set(9, 4, 0);
glScene.add(rightWall);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(20, 30), wallMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(0, 8.4, 0);
glScene.add(ceiling);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 30), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, 2);
floor.receiveShadow = true;
glScene.add(floor);

/* ───────────────────────────────────────────────────────────
   Seats — simple, abstract rows facing the screen
─────────────────────────────────────────────────────────── */
function seat(x, z, lift){
  const g = new THREE.Group();
  g.position.set(x, lift, z);
  const seatMat = new THREE.MeshStandardMaterial({ color: 0x1a1216, roughness: 0.75 });
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, 0.56), seatMat);
  pad.position.y = 0.46;
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.1), seatMat);
  back.position.set(0, 0.86, -0.25);
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.34, 0.56), seatMat);
  armL.position.set(-0.33, 0.6, 0);
  const armR = armL.clone(); armR.position.x = 0.33;
  const pipe = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.42, 0.06), new THREE.MeshStandardMaterial({ color: 0x0c0a0b }));
  pipe.position.set(0, 0.2, 0.26);
  [pad, back, armL, armR, pipe].forEach(m => { m.castShadow = true; g.add(m); });
  glScene.add(g);
}
const ROW_Z = [1.5, -0.5, -2.5];
const ROW_LIFT = [0.22, 0.1, 0];
const SEATS_PER_ROW = 7;
const SEAT_SPACING = 0.86;
ROW_Z.forEach((z, ri) => {
  for (let i = 0; i < SEATS_PER_ROW; i++){
    const x = (i - (SEATS_PER_ROW - 1) / 2) * SEAT_SPACING;
    seat(x, z, ROW_LIFT[ri]);
  }
});

/* faint aisle lights, mood-tinted, leading toward the screen */
for (let i = 0; i < 5; i++){
  const t = i / 4;
  const z = 4 - t * 9;
  [-3.6, 3.6].forEach(side => {
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.05, 10), new THREE.MeshBasicMaterial({ color: aisleColor }));
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(side, 0.02, z);
    glScene.add(dot);
    const pl = new THREE.PointLight(aisleColor, 0.35, 2, 2);
    pl.position.set(side, 0.15, z);
    glScene.add(pl);
  });
}

/* ───────────────────────────────────────────────────────────
   Popcorn — sitting in your lap, like it would be in a real
   seat. Attached to the camera (not the world) so it stays put
   in the corner of view through the entrance walk and the idle
   seated sway, the same way your own hands would.
─────────────────────────────────────────────────────────── */
function buildPopcorn(){
  const g = new THREE.Group();

  const stripeCanvas = document.createElement('canvas');
  stripeCanvas.width = 64; stripeCanvas.height = 64;
  const sctx = stripeCanvas.getContext('2d');
  sctx.fillStyle = '#F7F3E8'; sctx.fillRect(0, 0, 64, 64);
  sctx.fillStyle = '#D6433C';
  for (let i = 0; i < 8; i += 2) sctx.fillRect(i * 8, 0, 8, 64);
  const stripeTex = new THREE.CanvasTexture(stripeCanvas);
  stripeTex.wrapS = THREE.RepeatWrapping; stripeTex.repeat.set(3, 1);

  /* Basic (unlit) materials on purpose: the theater's ambient light is
     almost black by design, and this prop sits right at the camera's
     face, far from the screen-glow and aisle lights that light everything
     else — under normal lighting it would just render pitch black against
     a pitch-black backdrop. It should read as "a thing in your hand",
     always at full color, not as part of the lit theater set. */
  const bucket = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.13, 0.26, 16, 1, true),
    new THREE.MeshBasicMaterial({ map: stripeTex, side: THREE.DoubleSide })
  );
  g.add(bucket);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.012, 8, 20),
    new THREE.MeshBasicMaterial({ color: 0xF7F3E8 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.13;
  g.add(rim);

  const kernelMat = new THREE.MeshBasicMaterial({ color: 0xF3E3A8 });
  for (let i = 0; i < 16; i++){
    const k = new THREE.Mesh(new THREE.IcosahedronGeometry(0.04 + Math.random() * 0.018, 0), kernelMat);
    const ang = Math.random() * Math.PI * 2, rad = Math.random() * 0.15;
    k.position.set(Math.cos(ang) * rad, 0.14 + Math.random() * 0.09, Math.sin(ang) * rad);
    k.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    g.add(k);
  }

  g.scale.setScalar(1.35);
  return g;
}
const popcorn = buildPopcorn();
popcorn.position.set(0.44, -0.34, -0.9);
popcorn.rotation.set(-0.08, 0.3, -0.12);
camera.add(popcorn);
/* the camera itself is never drawn — only traversing it as part of
   the scene graph lets its attached children (the popcorn) render */
glScene.add(camera);

/* ───────────────────────────────────────────────────────────
   Camera entrance — start standing at the back of the theater,
   walk/dolly down to a seat, already facing a screen that's
   already playing.
─────────────────────────────────────────────────────────── */
const START_POS = new THREE.Vector3(0, 2.5, 9.5);
const START_LOOK = new THREE.Vector3(0, SCREEN_Y, SCREEN_Z);
/* Seat eye-height sits a realistic distance below the screen's vertical
   center — enough to look slightly up at it like a real theater seat,
   not so much that the pitch keystones the flat screen into a trapezoid. */
const SEAT_POS = new THREE.Vector3(0, 1.5, 0.4);
const SEAT_LOOK = new THREE.Vector3(0, SCREEN_Y - 0.1, SCREEN_Z);

camera.position.copy(START_POS);
camera.lookAt(START_LOOK);

let seated = false;
let entranceStart = null;
const ENTRANCE_MS = 2200;
const lookTmp = new THREE.Vector3();

function animateEntrance(now){
  if (entranceStart === null) entranceStart = now;
  const t = Math.min(1, (now - entranceStart) / ENTRANCE_MS);
  const e = 1 - Math.pow(1 - t, 3);
  camera.position.lerpVectors(START_POS, SEAT_POS, e);
  lookTmp.lerpVectors(START_LOOK, SEAT_LOOK, e);
  camera.lookAt(lookTmp);
  if (t >= 1 && !seated){
    seated = true;
    document.getElementById('rmMarquee').classList.add('show');
    document.getElementById('rmHint').classList.add('show');
    document.getElementById('rmStoryTab').classList.add('show');
  }
}

/* ───────────────────────────────────────────────────────────
   Resize + render loop
─────────────────────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  glRenderer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
});

function animate(now){
  requestAnimationFrame(animate);
  if (!seated){
    animateEntrance(now || performance.now());
  } else {
    /* a very subtle seated sway — ambient, not interactive */
    const t = (now || performance.now()) / 1000;
    camera.position.y = SEAT_POS.y + Math.sin(t * 0.35) * 0.015;
    lookTmp.copy(SEAT_LOOK);
    camera.lookAt(lookTmp);
  }
  glRenderer.render(glScene, camera);
  cssRenderer.render(cssScene, camera);
}

if (window.__cpSceneStarted) window.__cpSceneStarted();
if (window.__cpClearLoadTimeout) window.__cpClearLoadTimeout();
requestAnimationFrame(() => {
  document.getElementById('rmLoading').classList.add('hide');
  requestAnimationFrame(animate);
});
</script>
</body>
</html>
